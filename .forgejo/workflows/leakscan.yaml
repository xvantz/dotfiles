name: leakscan
# Страж публичной поверхности: ищет приватные термины в диффах, сообщениях коммитов
# и теле PR. Термины приходят из секрета LEAK_TERMS (по строке на термин), а не из репозитория.
# Сам сканер - modules/system/hermes/scripts/leakscan (код, не знания: поэтому публичный).
#
# Пока секрет не задан, джоба честно предупреждает и не падает: защита не настроена,
# но и не блокирует работу. Как только секрет появится — проверка становится обязательной.
#
# No `uses:` steps and no jq/python on the runner image: the clone is done by hand,
# and the scanner plus jq are pulled from nixpkgs at run time.
#
# `push` is the only trigger (a branch push used to fire `push` and `pull_request`
# together, so every check ran twice), which means the PR title and body are not in
# the event payload any more - they are fetched from the API for the commit's PR.
on: [push]

jobs:
  leakscan:
    runs-on: nix
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
        filter-syscalls = false
    steps:
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "https://git.827482.xyz/${{ github.repository }}.git"
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*:refs/pull/*'
          # GITHUB_SHA can name a merge commit that only exists in the ref, hence the fallback.
          git checkout -q --detach "$GITHUB_SHA" || git checkout -q --detach "$(git rev-parse "$GITHUB_REF")"
          git --no-pager log --oneline -1

      - name: Настроен ли список терминов
        id: conf
        run: |
          if [ -n "${{ secrets.LEAK_TERMS }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Список терминов не задан
        if: steps.conf.outputs.ok != 'true'
        run: |
          echo "::warning::секрет LEAK_TERMS не задан — проверка публичной поверхности выключена"
          echo "Задай репозиторный секрет LEAK_TERMS: приватные термины проекта, по одному на строку."

      - name: Проверка диффа и сообщений коммитов
        if: steps.conf.outputs.ok == 'true'
        run: |
          set -eu
          printf '%s\n' "${{ secrets.LEAK_TERMS }}" > "$RUNNER_TEMP/leak-terms.txt"
          SCAN=modules/system/hermes/scripts/leakscan

          base="${{ github.event.before }}"
          # A new branch has no previous commit, so compare against the fork point.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git merge-base origin/master HEAD)
          fi
          echo "диапазон: $base..HEAD"

          nix shell nixpkgs#python3 --command python3 "$SCAN" \
            --terms "$RUNNER_TEMP/leak-terms.txt" --require-terms --range "$base..HEAD"

      - name: Проверка заголовка и тела PR
        if: steps.conf.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SCAN=modules/system/hermes/scripts/leakscan
          host=${GITHUB_SERVER_URL#https://}
          printf 'machine %s login ci password %s\n' "$host" "$TOKEN" > "$RUNNER_TEMP/api.netrc"
          payload=$(curl -s --netrc-file "$RUNNER_TEMP/api.netrc" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/pulls?state=open&limit=50")
          if [ -z "$payload" ]; then
            echo "::warning::API не ответил — текст PR не проверен"
            exit 0
          fi
          text=$(printf '%s' "$payload" | nix shell nixpkgs#jq --command jq -r --arg sha "$GITHUB_SHA" \
            '.[] | select(.head.sha == $sha) | (.title // empty), (.body // empty)')
          if [ -z "$text" ]; then
            echo "у коммита $GITHUB_SHA нет открытого PR — проверять нечего"
            exit 0
          fi
          printf '%s\n' "$text" | nix shell nixpkgs#python3 --command python3 "$SCAN" \
            --terms "$RUNNER_TEMP/leak-terms.txt" --require-terms --text -
