name: ci
# No `uses:` steps on purpose: the nix runner image carries no Node.js, and a JS
# action (actions/checkout, actions/cache) dies with exit 127 before any step body
# runs. The clone is done by hand; the flake-source cache went with it, since a
# fresh container has no store to warm anyway.
on: [push, pull_request]

jobs:
  check:
    runs-on: nix
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
        filter-syscalls = false
    steps:
      # Full history (change detection diffs against the previous push) plus pull
      # refs, which is how a PR head reaches a clone of the base repo.
      - name: Checkout
        run: |
          set -eu
          git init -q .
          git remote add origin "https://git.827482.xyz/${{ github.repository }}.git"
          git fetch -q --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*:refs/pull/*'
          # GITHUB_SHA can name a merge commit that only exists in the ref, hence the fallback.
          git checkout -q --detach "$GITHUB_SHA" || git checkout -q --detach "$(git rev-parse "$GITHUB_REF")"
          git --no-pager log --oneline -1

      - name: Auth for private flake inputs
        run: |
          printf 'machine git.827482.xyz login ci password %s\n' '${{ secrets.READ_TOKEN }}' > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Detect changed areas
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if [ "$base" = "origin/" ]; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base" HEAD -- 2>/dev/null || true)
          echo "changed: $files"
          if [ -z "$files" ]; then
            echo "sys_changed=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -qvE '^(modules/home/|home\.nix$|README\.md$|\.forgejo/)'; then
            echo "sys_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sys_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: eval nixos toplevel (no builds)
        if: steps.changes.outputs.sys_changed == 'true'
        run: nix --option netrc-file "$HOME/.netrc" eval .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath

      - name: eval home-manager (no builds)
        run: nix --option netrc-file "$HOME/.netrc" eval .#homeConfigurations.xvantz.activationPackage.drvPath

      - name: deadnix on changed files (advisory)
        continue-on-error: true
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if [ "$base" = "origin/" ]; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base" HEAD -- '*.nix' 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "no nix files changed, skipping"
          else
            echo "checking: $files"
            # shellcheck disable=SC2086
            nix run nixpkgs#deadnix -- $files
          fi

      - name: statix (lint, advisory)
        continue-on-error: true
        run: nix run nixpkgs#statix -- check .
