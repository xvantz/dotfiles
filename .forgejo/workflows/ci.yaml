name: ci
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        sandbox = false
        filter-syscalls = false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cache nix flake sources
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.cache/nix
          key: nix-flake-${{ hashFiles('flake.lock') }}
          restore-keys: nix-flake-

      - name: Install Nix
        run: |
          sudo groupadd nixbld || true
          for i in $(seq 1 4); do
            sudo useradd -c "Nix build user $i" -d /var/empty -g nixbld -G nixbld -M -N -r -s /usr/sbin/nologin "nixbld$i" || true
          done
          curl -L https://nixos.org/nix/install -o /tmp/nix-install.sh
          sh /tmp/nix-install.sh --no-daemon

      - name: Auth for private flake inputs
        run: |
          printf 'machine git.827482.xyz login ci password %s\n' '${{ secrets.FORGEJO_READ_TOKEN }}' > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Detect changed areas
        id: changes
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="origin/${{ github.base_ref }}"
          fi
          if [ "$base" = "origin/" ]; then
            base="HEAD~1"
          fi
          files=$(git diff --name-only "$base" HEAD -- 2>/dev/null || true)
          echo "changed: $files"
          if [ -z "$files" ]; then
            echo "sys_changed=true" >> "$GITHUB_OUTPUT"
          elif echo "$files" | grep -qvE '^(modules/home/|home\.nix$|README\.md$|\.forgejo/)'; then
            echo "sys_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sys_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: eval nixos toplevel (no builds)
        if: steps.changes.outputs.sys_changed == 'true'
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix --option netrc-file "$HOME/.netrc" eval .#nixosConfigurations.nixos.config.system.build.toplevel.drvPath

      - name: eval home-manager (no builds)
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix --option netrc-file "$HOME/.netrc" eval .#homeConfigurations.xvantz.activationPackage.drvPath

      - name: deadnix (unused code, advisory)
        continue-on-error: true
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix run nixpkgs#deadnix -- .

      - name: statix (lint, advisory)
        continue-on-error: true
        run: |
          . "$HOME/.nix-profile/etc/profile.d/nix.sh"
          nix run nixpkgs#statix -- check .
